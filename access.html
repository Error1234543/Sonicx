<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Granted</title>

<style>

body{
margin:0;
padding:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:320px;
background:#0f172a;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.loader{
width:55px;
height:55px;
border-radius:50%;
border:5px solid rgba(255,255,255,0.1);
border-top:5px solid #22c55e;
margin:20px auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

p{
color:#94a3b8;
line-height:1.7;
}

</style>
</head>
<body>

<div class="box">

<h1>✅ Access Granted</h1>

<div class="loader"></div>

<p id="status">
Activating your premium access...
</p>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const token = params.get("token");

if(token){

const expiry = Date.now() + (24 * 60 * 60 * 1000);

localStorage.setItem("premium_token", token);

localStorage.setItem("premium_expiry", expiry);

document.getElementById("status").innerText =
"Access activated successfully.";

setTimeout(()=>{

window.location.href = "index.html";

},2000);

}else{

document.getElementById("status").innerText =
"Invalid token.";

}

</script>

</body>
</html>
