<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate Access</title>

<style>

body{
margin:0;
padding:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:330px;
background:#0f172a;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

h1{
margin-bottom:10px;
}

p{
color:#94a3b8;
line-height:1.7;
font-size:14px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
margin-top:25px;
}

#status{
margin-top:20px;
font-size:14px;
color:#4ade80;
word-break:break-word;
}

</style>
</head>
<body>

<div class="box">

<h1>🔐 Generate Token</h1>

<p>
Generate a secure 24-hour premium access link.
</p>

<button onclick="generateLink()">
Generate Access Link
</button>

<div id="status"></div>

</div>

<script>

async function generateLink(){

const status = document.getElementById("status");

status.innerText = "Generating secure link...";

const token = Math.random().toString(36).substring(2,12);

const targetUrl = `https://testzone-pro.netlify.app/access.html?token=${token}`;

// REPLACE API TOKEN
const api = `https://vplink.in/api?api=e32db917e607b20e6cb4d8dcc776909617a9895d&url=${encodeURIComponent(targetUrl)}`;

try{

const response = await fetch(api);

const data = await response.json();

if(data.status === "success"){

window.location.href = data.shortenedUrl;

}else{

status.innerText = "Failed to generate link.";

}

}catch(err){

status.innerText = "API Error.";

}

}

</script>

</body>
</html>
