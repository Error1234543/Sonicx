<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotating Octagon</title>

<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #111;
}

/* Octagon shape */
.octagon {
  width: 120px;
  height: 120px;
  background: #00ffcc;
  position: relative;
  animation: spin 3s linear infinite;
}

/* create 8 sides using pseudo elements */
.octagon:before,
.octagon:after {
  content: "";
  position: absolute;
  background: #00ffcc;
}

.octagon:before {
  width: 85px;
  height: 120px;
  left: 17px;
}

.octagon:after {
  width: 120px;
  height: 85px;
  top: 17px;
}

/* rotation animation */
@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
</style>

</head>

<body>

<div class="octagon"></div>

</body>
</html>
